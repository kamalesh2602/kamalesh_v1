<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />  <stop offset="100%" stop-color="#2563eb" /> </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" /> </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="140" fill="#0c0822" />

  <rect x="64" y="64" width="384" height="384" rx="100" fill="url(#neonGlow)" filter="url(#dropShadow)" />

  <text 
    x="50%" 
    y="53%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    fill="url(#textGradient)" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="180" 
    letter-spacing="-0.03em"
    style="drop-shadow: 0px 4px 12px rgba(0,0,0,0.3);"
  >
    GK
  </text>
</svg>
